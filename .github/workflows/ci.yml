name: MCP Shield CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Test Suite
        run: |
          python test_mcp_shield.py 2>&1 | tee test_output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
      - name: Generate Test Report
        if: always()
        run: |
          echo "# MCP Shield Test Report" > test_report.md
          echo '```' >> test_report.md
          cat test_output.txt >> test_report.md
          echo '```' >> test_report.md
      - name: Post to Job Summary
        if: always()
        run: |
          echo "## MCP Shield Tests (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            test_output.txt
            test_report.md
          retention-days: 90
      - name: Verify zero dependencies
        run: python -c "import mcp_shield; print('Import OK')"
      - name: Fail if tests failed
        if: always()
        run: |
          if [ "$EXIT_CODE" != "0" ]; then exit 1; fi